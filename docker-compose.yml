services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: consultant
      POSTGRES_USER: consultant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consultant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultant -d consultant"]
      interval: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://consultant:${POSTGRES_PASSWORD:-consultant}@db:5432/consultant
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    command: ["python", "-m", "app.bot"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://consultant:${POSTGRES_PASSWORD:-consultant}@db:5432/consultant
    depends_on:
      db:
        condition: service_healthy
    profiles: ["bot"]  # needs TELEGRAM_BOT_TOKEN: docker compose --profile bot up

volumes:
  pgdata:
