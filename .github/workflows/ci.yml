name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: e5-small-int8-v1
      - run: python scripts/download_model.py
      - run: ruff check . && ruff format --check .
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql://t:t@localhost:5432/t
      - name: kb-index.json is up to date with the base
        # vectors may differ in the last digits between CPUs, so texts must match and vectors be close
        run: |
          python scripts/export_index.py /tmp/kb-index.json
          python - <<'EOF'
          import json
          a = json.load(open("/tmp/kb-index.json", encoding="utf-8"))
          b = json.load(open("widget/kb-index.json", encoding="utf-8"))
          strip = lambda d: {**d, "chunks": [{k: v for k, v in c.items() if k != "vec"} for c in d["chunks"]]}
          assert strip(a) == strip(b), "widget/kb-index.json is stale: run scripts/export_index.py"
          worst = max(abs(x - y) for ca, cb in zip(a["chunks"], b["chunks"]) for x, y in zip(ca["vec"], cb["vec"]))
          assert worst < 1e-3, worst
          EOF
